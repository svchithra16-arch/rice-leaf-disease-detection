<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostic Reports - AgriVersion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
</head>
<body>

  <!-- Navbar Placeholder -->
  <div id="navbarPlaceholder"></div>

  <div class="container py-4">
    <!-- Header with Rice Leaf Garden Background -->
    <div class="rice-garden-header">
      <div class="d-flex flex-wrap justify-content-between align-items-center gy-3">
        <div>
          <div class="d-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill mb-2" style="background:rgba(16,185,129,0.25);border:1px solid rgba(52,211,153,0.45);">
            <span class="badge bg-success" style="font-size:0.75rem;">OFFICIAL REPORTS</span>
            <small class="text-white fw-semibold">XAI Pathology PDFs</small>
          </div>
          <h2 class="text-white fw-bold mb-1" data-i18n="nav.reports">Diagnostic PDF Reports Center</h2>
          <p class="mb-0" style="color:#d1fae5;">Official pathology reports with Grad-CAM heatmaps, severity metrics, and chemical advisories</p>
        </div>
        <a href="/detect.html" class="btn-agri-primary">
          <i class="fas fa-plus-circle me-1"></i> <span data-i18n="nav.detect">New Diagnosis</span>
        </a>
      </div>
    </div>

    <!-- Reports Table -->
    <div class="glass-card p-4">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" style="background:transparent;">
          <thead>
            <tr style="font-size:0.85rem;">
              <th data-i18n="history.col_disease">DIAGNOSED DISEASE</th>
              <th data-i18n="history.col_severity">SEVERITY</th>
              <th>FIELD / PLOT</th>
              <th data-i18n="history.col_date">GENERATION DATE</th>
              <th class="text-end" data-i18n="history.col_action">DOWNLOAD PDF</th>
            </tr>
          </thead>
          <tbody id="reportsTableBody">
            <tr>
              <td colspan="5" class="text-center text-muted py-4">Loading reports archive...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Footer Placeholder -->
  <div id="footerPlaceholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      AgriApp.renderNavbar();
      AgriApp.renderFooter();
      await AgriApp.checkAuth(true);
      loadReports();
    });

    async function loadReports() {
      try {
        const res = await fetch("/api/detect/history");
        const data = await res.json();
        const tbody = document.getElementById("reportsTableBody");
        if (!tbody) return;

        if (!data.history || data.history.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No diagnostic reports generated yet. Run a disease scan to create your first report!</td></tr>`;
          return;
        }

        let html = "";
        data.history.forEach(h => {
          html += `
            <tr style="border-color:rgba(255,255,255,0.05);">
              <td>
                <div class="d-flex align-items-center gap-2">
                  <div class="brand-icon" style="font-size:1.4rem;">📄</div>
                  <div>
                    <b class="text-white">${AgriApp.escapeHtml(h.disease_name)}</b>
                    <small class="text-muted d-block">Confidence: ${h.confidence.toFixed(2)}%</small>
                  </div>
                </div>
              </td>
              <td><span class="badge badge-sev-${h.severity_level.toLowerCase()}">${h.severity_level.toUpperCase()}</span></td>
              <td><small class="text-muted">${h.farm_name ? h.farm_name + ' - ' : ''}${h.field_name || 'General Field'}</small></td>
              <td><small class="text-muted">${h.created_at}</small></td>
              <td class="text-end">
                ${h.report_pdf_url ? 
                  `<a href="${h.report_pdf_url}" target="_blank" class="btn btn-sm btn-agri-primary">
                    <i class="fas fa-file-pdf me-1"></i> Download PDF
                   </a>` : 
                  `<a href="/api/detect/${h.id}/pdf" target="_blank" class="btn btn-sm btn-agri-outline">
                    <i class="fas fa-cog fa-spin me-1"></i> Generate
                   </a>`
                }
              </td>
            </tr>
          `;
        });

        tbody.innerHTML = html;
      } catch (e) {
        console.warn("Reports error:", e);
      }
    }
  </script>
</body>
</html>
