<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan History - AgriVersion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
</head>
<body>

  <!-- Navbar Placeholder -->
  <div id="navbarPlaceholder"></div>

  <div class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gy-3">
      <div>
        <h2 class="text-white fw-bold mb-1" data-i18n="nav.history">Scan History</h2>
        <p class="text-muted mb-0">Browse and export all previous leaf diagnostics and field pathology reports</p>
      </div>
      <a href="/detect.html" class="btn-agri-primary">
        <i class="fas fa-plus-circle me-1"></i> <span data-i18n="nav.detect">New Disease Scan</span>
      </a>
    </div>

    <!-- Filters Bar -->
    <div class="glass-card mb-4 p-3">
      <div class="row g-3">
        <div class="col-md-5">
          <div class="input-group">
            <span class="input-group-text bg-dark border-0 text-muted"><i class="fas fa-search"></i></span>
            <input type="text" id="filterDiseaseInput" class="form-control form-control-agri" placeholder="Search disease name (e.g. Blast, Blight)...">
          </div>
        </div>
        <div class="col-md-4">
          <select id="filterSeveritySelect" class="form-select form-control-agri">
            <option value="">All Severity Levels</option>
            <option value="Healthy">Healthy</option>
            <option value="Low">Low</option>
            <option value="Mild">Mild</option>
            <option value="Moderate">Moderate</option>
            <option value="Severe">Severe</option>
          </select>
        </div>
        <div class="col-md-3">
          <button class="btn-agri-outline w-100" onclick="applyHistoryFilters()">
            <i class="fas fa-filter me-1"></i> Apply Filters
          </button>
        </div>
      </div>
    </div>

    <!-- History Table -->
    <div class="glass-card p-4">
      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0" style="background:transparent;">
          <thead>
            <tr class="text-muted" style="border-color:rgba(255,255,255,0.08);font-size:0.85rem;">
              <th>LEAF IMAGE</th>
              <th>DIAGNOSED DISEASE</th>
              <th>CONFIDENCE</th>
              <th>SEVERITY</th>
              <th>DATE & TIME</th>
              <th class="text-end">ACTIONS</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr>
              <td colspan="6" class="text-center text-muted py-4">Loading history...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal fade" id="historyDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content glass-card border-0">
        <div class="modal-header border-bottom" style="border-color:rgba(255,255,255,0.1) !important;">
          <h5 class="modal-title text-white fw-bold" id="detailModalTitle">Scan Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="detailModalBody">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Placeholder -->
  <div id="footerPlaceholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    let allHistory = [];

    document.addEventListener("DOMContentLoaded", async () => {
      AgriApp.renderNavbar();
      AgriApp.renderFooter();
      await AgriApp.checkAuth(true);
      loadHistory();
    });

    async function loadHistory() {
      try {
        const res = await fetch("/api/detect/history");
        const data = await res.json();
        if (data.success) {
          allHistory = data.history;
          renderHistoryTable(allHistory);
        }
      } catch (e) {
        console.warn("History error:", e);
      }
    }

    function applyHistoryFilters() {
      const q = document.getElementById("filterDiseaseInput").value.trim().toLowerCase();
      const sev = document.getElementById("filterSeveritySelect").value;

      let filtered = allHistory;
      if (q) {
        filtered = filtered.filter(item => item.disease_name.toLowerCase().includes(q));
      }
      if (sev) {
        filtered = filtered.filter(item => item.severity_level === sev);
      }
      renderHistoryTable(filtered);
    }

    function renderHistoryTable(list) {
      const tbody = document.getElementById("historyTableBody");
      if (!tbody) return;

      if (!list || list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No scan records found matching filters.</td></tr>`;
        return;
      }

      let html = "";
      list.forEach(item => {
        html += `
          <tr style="border-color:rgba(255,255,255,0.05);">
            <td>
              ${item.image_url ? `<img src="${item.image_url}" style="width:45px;height:45px;object-fit:cover;border-radius:8px;border:1px solid var(--border-glass);" />` : '<div style="width:45px;height:45px;background:rgba(255,255,255,0.05);border-radius:8px;display:flex;align-items:center;justify-content:center;">🌾</div>'}
            </td>
            <td>
              <b class="text-white">${AgriApp.escapeHtml(item.disease_name)}</b>
              <div style="font-size:0.8rem;" class="text-muted">${item.farm_name ? item.farm_name + ' - ' : ''}${item.field_name || 'General Scan'}</div>
            </td>
            <td><b class="text-emerald">${item.confidence.toFixed(2)}%</b></td>
            <td><span class="badge badge-sev-${item.severity_level.toLowerCase()}">${item.severity_level.toUpperCase()}</span></td>
            <td><small class="text-muted">${item.created_at}</small></td>
            <td class="text-end">
              <div class="d-inline-flex gap-2">
                <button class="btn btn-sm btn-agri-outline p-1 px-2" onclick="viewHistoryDetail(${item.id})"><i class="fas fa-eye"></i> View</button>
                ${item.report_pdf_url ? `<a href="${item.report_pdf_url}" target="_blank" class="btn btn-sm btn-agri-primary p-1 px-2"><i class="fas fa-file-pdf"></i> PDF</a>` : ''}
                <button class="btn btn-sm btn-outline-danger p-1" onclick="deleteHistoryRecord(${item.id})"><i class="fas fa-trash"></i></button>
              </div>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    function viewHistoryDetail(predId) {
      const item = allHistory.find(h => h.id === predId);
      if (!item) return;

      document.getElementById("detailModalTitle").textContent = `${item.disease_name} Diagnosis`;
      const body = document.getElementById("detailModalBody");

      body.innerHTML = `
        <div class="row g-3 mb-3 text-center">
          <div class="col-6">
            <small class="text-muted d-block mb-1">Original Specimen</small>
            ${item.image_url ? `<img src="${item.image_url}" class="img-fluid rounded" style="max-height:180px;" />` : '<div class="p-4 bg-dark text-muted">No Image</div>'}
          </div>
          <div class="col-6">
            <small class="text-emerald d-block mb-1">Grad-CAM Attention Map</small>
            ${item.gradcam_url ? `<img src="${item.gradcam_url}" class="img-fluid rounded" style="max-height:180px;" />` : '<div class="p-4 bg-dark text-muted">No Heatmap</div>'}
          </div>
        </div>
        <div class="p-3 rounded mb-3" style="background:rgba(255,255,255,0.03);">
          <div class="row">
            <div class="col-6"><b>Confidence:</b> <span class="text-emerald">${item.confidence.toFixed(2)}%</span></div>
            <div class="col-6"><b>Severity:</b> <span class="badge badge-sev-${item.severity_level.toLowerCase()}">${item.severity_level}</span></div>
          </div>
          <div class="row mt-2" style="font-size:0.85rem;">
            <div class="col-6">Healthy Tissue: <b>${item.healthy_area_pct}%</b></div>
            <div class="col-6">Lesions Area: <b>${item.affected_area_pct}%</b></div>
          </div>
        </div>
        ${item.report_pdf_url ? `<div class="text-end"><a href="${item.report_pdf_url}" target="_blank" class="btn-agri-primary btn-sm"><i class="fas fa-file-pdf me-1"></i> Download PDF Report</a></div>` : ''}
      `;

      new bootstrap.Modal(document.getElementById("historyDetailModal")).show();
    }

    async function deleteHistoryRecord(predId) {
      if (!confirm("Are you sure you want to delete this scan record?")) return;
      try {
        await fetch(`/api/detect/${predId}`, { method: "DELETE" });
        AgriApp.showToast("Record deleted.", "success");
        loadHistory();
      } catch (e) {
        AgriApp.showToast("Error deleting record.", "error");
      }
    }
  </script>
</body>
</html>
