<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Farms - AgriVersion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
</head>
<body>

  <!-- Navbar Placeholder -->
  <div id="navbarPlaceholder"></div>

  <div class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gy-3">
      <div>
        <h2 class="text-white fw-bold mb-1" data-i18n="farms.title">My Farms & Acreage Management</h2>
        <p class="text-muted mb-0">Organize your paddy acreage, plots, and track field-level disease incidence</p>
      </div>
      <button class="btn-agri-primary" data-bs-toggle="modal" data-bs-target="#addFarmModal" data-i18n="farms.add_farm_btn">
        <i class="fas fa-plus-circle me-1"></i> + Add New Farm
      </button>
    </div>

    <!-- Farms Grid Container -->
    <div class="row" id="farmsContainer">
      <div class="col-12 text-center text-muted py-5">
        <span class="spinner-agri me-2"></span> Loading registered farms...
      </div>
    </div>
  </div>

  <!-- Add Farm Modal -->
  <div class="modal fade" id="addFarmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-card border-0">
        <div class="modal-header border-bottom" style="border-color:rgba(255,255,255,0.1) !important;">
          <h5 class="modal-title text-white fw-bold"><i class="fas fa-tractor text-emerald me-2"></i> Register New Farm</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="addFarmForm" onsubmit="handleCreateFarm(event)">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label-agri" data-i18n="farms.farm_name">Farm Name</label>
              <input type="text" id="farmNameInput" class="form-control form-control-agri" placeholder="Sri Venkateshwara Farm" required>
            </div>
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label-agri mb-0" data-i18n="farms.location">Location / Region</label>
                <button type="button" class="btn btn-sm btn-outline-success py-0 px-2" style="font-size:0.75rem;" onclick="detectFarmLocation()">
                  <i class="fas fa-crosshairs me-1"></i> Auto-Detect Live Location
                </button>
              </div>
              <input type="text" id="farmLocationInput" class="form-control form-control-agri" placeholder="Mandya, Karnataka" required>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label-agri" data-i18n="farms.total_area">Total Area (Acres)</label>
                <input type="number" step="0.1" id="farmAreaInput" class="form-control form-control-agri" value="2.5" required>
              </div>
              <div class="col-6">
                <label class="form-label-agri" data-i18n="farms.soil_type">Soil Type</label>
                <input type="text" id="farmSoilInput" class="form-control form-control-agri" value="Clayey Loam">
              </div>
            </div>
          </div>
          <div class="modal-footer border-top" style="border-color:rgba(255,255,255,0.1) !important;">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn-agri-primary">Save Farm</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Add Field Modal -->
  <div class="modal fade" id="addFieldModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-card border-0">
        <div class="modal-header border-bottom" style="border-color:rgba(255,255,255,0.1) !important;">
          <h5 class="modal-title text-white fw-bold"><i class="fas fa-layer-group text-emerald me-2"></i> Add Field / Plot</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="addFieldForm" onsubmit="handleCreateField(event)">
          <input type="hidden" id="fieldTargetFarmId">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label-agri" data-i18n="farms.field_name">Field Name / Plot ID</label>
              <input type="text" id="fieldNameInput" class="form-control form-control-agri" placeholder="Plot A (North Sector)" required>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label-agri" data-i18n="farms.crop_variety">Rice Variety</label>
                <input type="text" id="fieldVarietyInput" class="form-control form-control-agri" placeholder="IR64 / Samba Mahsuri" required>
              </div>
              <div class="col-6">
                <label class="form-label-agri" data-i18n="farms.sowing_date">Sowing Date</label>
                <input type="date" id="fieldSowingDateInput" class="form-control form-control-agri">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label-agri" data-i18n="farms.notes">Field Notes</label>
              <textarea id="fieldNotesInput" class="form-control form-control-agri" rows="2" placeholder="e.g. Canal irrigated, panicle initiation stage"></textarea>
            </div>
          </div>
          <div class="modal-footer border-top" style="border-color:rgba(255,255,255,0.1) !important;">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn-agri-primary">Save Field</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Footer Placeholder -->
  <div id="footerPlaceholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/farms.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      AgriApp.renderNavbar();
      AgriApp.renderFooter();
    });
  </script>
</body>
</html>
