<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile & Settings - AgriVersion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
</head>
<body>

  <!-- Navbar Placeholder -->
  <div id="navbarPlaceholder"></div>

  <div class="container py-4">
    <div class="mb-4">
      <h2 class="text-white fw-bold mb-1" data-i18n="nav.profile">User Profile & Application Settings</h2>
      <p class="text-muted mb-0">Manage regional localization, voice assistant configuration, and account security</p>
    </div>

    <div class="row g-4">
      <!-- Profile Information -->
      <div class="col-lg-7">
        <div class="glass-card p-4 mb-4">
          <h5 class="text-white fw-bold mb-3"><i class="fas fa-user-circle text-emerald me-2"></i> Farmer Profile Details</h5>
          
          <form id="profileForm" onsubmit="handleUpdateProfile(event)">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label-agri" data-i18n="auth.full_name">Full Name</label>
                <input type="text" id="profFullName" class="form-control form-control-agri" required>
              </div>
              <div class="col-md-6">
                <label class="form-label-agri" data-i18n="auth.username">Username</label>
                <input type="text" id="profUsername" class="form-control form-control-agri" readonly disabled>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label-agri" data-i18n="auth.email">Email Address</label>
                <input type="email" id="profEmail" class="form-control form-control-agri" readonly disabled>
              </div>
              <div class="col-md-6">
                <label class="form-label-agri" data-i18n="auth.phone">Mobile Number</label>
                <input type="tel" id="profPhone" class="form-control form-control-agri">
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label-agri" data-i18n="auth.location">Location / District</label>
                <input type="text" id="profLocation" class="form-control form-control-agri">
              </div>
              <div class="col-md-6">
                <label class="form-label-agri">Default Language</label>
                <select id="profLangSelect" class="form-select form-control-agri">
                  <option value="en">English (English)</option>
                  <option value="kn">Kannada (ಕನ್ನಡ)</option>
                  <option value="te">Telugu (తెలుగు)</option>
                  <option value="hi">Hindi (हिन्दी)</option>
                  <option value="ta">Tamil (தமிழ்)</option>
                  <option value="ml">Malayalam (മലയാളം)</option>
                  <option value="mr">Marathi (मराठी)</option>
                  <option value="bn">Bengali (বাংলা)</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn-agri-primary">
              <i class="fas fa-save me-1"></i> Save Profile Changes
            </button>
          </form>
        </div>
      </div>

      <!-- Security: Change Password -->
      <div class="col-lg-5">
        <div class="glass-card p-4">
          <h5 class="text-white fw-bold mb-3"><i class="fas fa-lock text-warning me-2"></i> Change Password</h5>
          
          <form id="passwordForm" onsubmit="handleChangePassword(event)">
            <div class="mb-3">
              <label class="form-label-agri">Current Password</label>
              <input type="password" id="oldPassword" class="form-control form-control-agri" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
              <label class="form-label-agri">New Password</label>
              <input type="password" id="newPassword" class="form-control form-control-agri" placeholder="••••••••" required>
            </div>
            <div class="mb-4">
              <label class="form-label-agri">Confirm New Password</label>
              <input type="password" id="confirmNewPassword" class="form-control form-control-agri" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-agri-outline w-100">
              <i class="fas fa-key me-1"></i> Update Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Placeholder -->
  <div id="footerPlaceholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      AgriApp.renderNavbar();
      AgriApp.renderFooter();
      const user = await AgriApp.checkAuth(true);
      if (user) {
        document.getElementById("profFullName").value = user.full_name || "";
        document.getElementById("profUsername").value = user.username || "";
        document.getElementById("profEmail").value = user.email || "";
        document.getElementById("profPhone").value = user.phone || "";
        document.getElementById("profLocation").value = user.location || "";
        document.getElementById("profLangSelect").value = user.preferred_lang || "en";
      }
    });

    async function handleUpdateProfile(e) {
      e.preventDefault();
      const name = document.getElementById("profFullName").value.trim();
      const phone = document.getElementById("profPhone").value.trim();
      const location = document.getElementById("profLocation").value.trim();
      const lang = document.getElementById("profLangSelect").value;

      try {
        const res = await fetch("/api/auth/profile", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ full_name: name, phone, location, preferred_lang: lang })
        });
        const data = await res.json();
        if (data.success) {
          AgriApp.showToast("Profile updated successfully.", "success");
          if (window.AgriI18n) {
            AgriI18n.setLanguage(lang);
          }
        } else {
          AgriApp.showToast(data.message || "Update failed.", "error");
        }
      } catch (err) {
        AgriApp.showToast("Error saving profile.", "error");
      }
    }

    async function handleChangePassword(e) {
      e.preventDefault();
      const old_pwd = document.getElementById("oldPassword").value;
      const new_pwd = document.getElementById("newPassword").value;
      const conf_pwd = document.getElementById("confirmNewPassword").value;

      if (new_pwd !== conf_pwd) {
        AgriApp.showToast("New passwords do not match.", "error");
        return;
      }

      try {
        const res = await fetch("/api/auth/password", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ old_password: old_pwd, new_password: new_pwd, confirm_password: conf_pwd })
        });
        const data = await res.json();
        if (data.success) {
          AgriApp.showToast("Password updated successfully.", "success");
          document.getElementById("passwordForm").reset();
        } else {
          AgriApp.showToast(data.message || "Password update failed.", "error");
        }
      } catch (err) {
        AgriApp.showToast("Error updating password.", "error");
      }
    }
  </script>
</body>
</html>
