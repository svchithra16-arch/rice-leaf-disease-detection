<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - AgriVersion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
</head>
<body>

  <!-- Navbar Placeholder -->
  <div id="navbarPlaceholder"></div>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-5 col-sm-8">
        <div class="glass-card p-4 p-md-5">
          <div class="text-center mb-4">
            <span class="fs-1">🌾</span>
            <h3 class="fw-bold text-white mt-2" data-i18n="auth.login_title">Sign In to AgriVersion</h3>
            <p class="text-muted" style="font-size:0.9rem;" data-i18n="auth.login_subtitle">
              Access your farm diagnostics, AI consultations, and disease records
            </p>
          </div>

          <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="mb-3">
              <label class="form-label-agri" data-i18n="auth.email">Username or Email</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-0 text-muted"><i class="fas fa-user"></i></span>
                <input type="text" id="loginIdentifier" class="form-control form-control-agri" placeholder="farmer@agriversion.com" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label-agri mb-0" data-i18n="auth.password">Password</label>
                <a href="javascript:void(0)" class="text-emerald" style="font-size:0.8rem;" onclick="AgriApp.showToast('Please use demo login credentials or contact administrator.', 'info')" data-i18n="auth.forgot_password">Forgot Password?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-dark border-0 text-muted"><i class="fas fa-lock"></i></span>
                <input type="password" id="loginPassword" class="form-control form-control-agri" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('loginPassword', this)">
                  <i class="fas fa-eye text-muted"></i>
                </button>
              </div>
            </div>

            <div class="d-flex align-items-center justify-content-between mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMeCheckbox">
                <label class="form-check-label text-muted" for="rememberMeCheckbox" style="font-size:0.88rem;" data-i18n="auth.remember_me">
                  Remember me
                </label>
              </div>
            </div>

            <div class="d-grid gap-2 mb-4">
              <button type="submit" id="btnLoginSubmit" class="btn-agri-primary" style="padding:0.75rem;">
                <span data-i18n="auth.btn_login">Sign In</span> <i class="fas fa-arrow-right ms-1"></i>
              </button>
            </div>

            <!-- Demo Quick Login Buttons for Viva Demonstration -->
            <div class="p-3 rounded mb-4 text-center" style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);">
              <small class="text-muted d-block mb-2"><i class="fas fa-bolt text-warning me-1"></i> <b>Project Viva / Evaluation Demo Login:</b></small>
              <div class="d-flex gap-2 justify-content-center">
                <button type="button" class="btn btn-sm btn-outline-success" onclick="quickDemoLogin('user')">
                  <i class="fas fa-tractor me-1"></i> Demo Farmer
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="quickDemoLogin('admin')">
                  <i class="fas fa-shield-alt me-1"></i> Demo Admin
                </button>
              </div>
            </div>

            <div class="text-center">
              <span class="text-muted" style="font-size:0.9rem;" data-i18n="auth.no_account">Don't have an account?</span>
              <a href="/register.html" class="text-emerald fw-bold ms-1" style="font-size:0.9rem;" data-i18n="auth.btn_register">Create Account</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Placeholder -->
  <div id="footerPlaceholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      AgriApp.renderNavbar();
      AgriApp.renderFooter();
      AgriApp.checkAuth(false);

      const params = new URLSearchParams(window.location.search);
      if (params.get("reason") === "auth_required") {
        AgriApp.showToast("Please sign in to access your dashboard and farm services.", "warning");
      }
    });

    function getRedirectTarget(userRole) {
      const params = new URLSearchParams(window.location.search);
      const nextParam = params.get("next");
      if (nextParam && nextParam.startsWith("/")) {
        return nextParam;
      }
      return userRole === "admin" ? "/admin.html" : "/dashboard.html";
    }

    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      if (field.type === "password") {
        field.type = "text";
        btn.innerHTML = '<i class="fas fa-eye-slash text-emerald"></i>';
      } else {
        field.type = "password";
        btn.innerHTML = '<i class="fas fa-eye text-muted"></i>';
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const identifier = document.getElementById("loginIdentifier").value.trim();
      const password = document.getElementById("loginPassword").value;
      const remember = document.getElementById("rememberMeCheckbox").checked;
      const btn = document.getElementById("btnLoginSubmit");

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Signing In...';

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier, password, remember_me: remember })
        });
        const data = await res.json();
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In</span> <i class="fas fa-arrow-right ms-1"></i>';

        if (data.success) {
          AgriApp.showToast(data.message || "Welcome back!", "success");
          setTimeout(() => {
            window.location.href = getRedirectTarget(data.user.role);
          }, 600);
        } else {
          AgriApp.showToast(data.message || "Invalid credentials.", "error");
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In</span> <i class="fas fa-arrow-right ms-1"></i>';
        AgriApp.showToast("Server error during sign in.", "error");
      }
    }

    async function quickDemoLogin(role) {
      try {
        const res = await fetch("/api/auth/demo-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ role })
        });
        const data = await res.json();
        if (data.success) {
          AgriApp.showToast(data.message, "success");
          setTimeout(() => {
            window.location.href = getRedirectTarget(data.user.role);
          }, 500);
        }
      } catch (e) {
        AgriApp.showToast("Demo login failed.", "error");
      }
    }
  </script>
</body>
</html>
