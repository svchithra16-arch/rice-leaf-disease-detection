<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Camera Scanner - AgriVersion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
</head>
<body>

  <!-- Navbar Placeholder -->
  <div id="navbarPlaceholder"></div>

  <div class="container py-4">
    <div class="mb-4">
      <h2 class="text-white fw-bold mb-1" data-i18n="nav.camera">Live Camera Scanner</h2>
      <p class="text-muted mb-0">Capture real-time snapshots of rice leaf lesions directly in your paddy field</p>
    </div>

    <!-- Error Alert if camera unavailable -->
    <div id="cameraErrorAlert" class="alert alert-danger d-none mb-4" role="alert"></div>

    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="glass-card p-3 p-md-4 text-center">
          
          <!-- Live Viewfinder Container -->
          <div id="cameraViewContainer" class="scan-laser-box position-relative mb-3">
            <video id="cameraFeed" autoplay playsinline class="w-100 rounded" style="max-height:460px;object-fit:cover;background:#000;border:1px solid var(--border-glass);"></video>
            <div class="scan-laser-line"></div>
            
            <div class="position-absolute bottom-0 start-50 translate-middle-x mb-3 d-flex gap-3" style="z-index:20;">
              <button class="btn btn-dark rounded-circle p-3 shadow" title="Flip Camera" onclick="toggleCameraFacing()">
                <i class="fas fa-sync-alt fa-lg text-emerald"></i>
              </button>
              <button class="btn btn-success rounded-circle p-3 shadow" style="width:64px;height:64px;" title="Capture Snapshot" onclick="captureSnapshot()">
                <i class="fas fa-camera fa-2x"></i>
              </button>
            </div>
          </div>

          <!-- Captured Snapshot Preview Container -->
          <div id="capturedPreviewContainer" class="d-none mb-3">
            <img id="capturedImgPreview" src="" class="img-fluid rounded mb-3" style="max-height:400px;border:1px solid var(--border-glass);" alt="Captured Leaf Snapshot">
            <div class="d-flex justify-content-center gap-3">
              <button class="btn-agri-outline" onclick="retakeSnapshot()">
                <i class="fas fa-redo"></i> Retake Photo
              </button>
              <button id="btnAnalyzeSnap" class="btn-agri-primary" onclick="analyzeCapturedPhoto()">
                <i class="fas fa-microscope"></i> Diagnose Leaf Now
              </button>
            </div>
          </div>

          <canvas id="snapshotCanvas" class="d-none"></canvas>

          <!-- Camera Inference Progress -->
          <div id="cameraProgressSection" class="d-none p-4 rounded text-center my-3" style="background:rgba(16,185,129,0.08);">
            <span class="spinner-agri mb-2"></span>
            <h6 class="text-white fw-bold mb-0">Analyzing foliage pathology...</h6>
          </div>
        </div>
      </div>
    </div>

    <!-- Diagnostic Result Section (Rendered dynamically) -->
    <div id="cameraResultSection" class="d-none mt-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="glass-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h4 id="camResDisease" class="text-white fw-bold mb-1">Rice Blast</h4>
                <small class="text-muted">AI Confidence: <b id="camResConf" class="text-emerald">95.4%</b></small>
              </div>
              <span id="camResSeverity" class="badge badge-sev-moderate fs-6">MODERATE</span>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <small class="text-muted d-block mb-1">Grad-CAM Neural Attention</small>
                <img id="camResGradcam" src="" class="img-fluid rounded" style="max-height:180px;border:1px solid var(--border-glass);" alt="Attention Heatmap">
              </div>
              <div class="col-md-6">
                <h6 class="text-white fw-bold mb-1"><i class="fas fa-notes-medical text-emerald me-1"></i> Symptoms</h6>
                <p id="camResSymptoms" class="text-muted" style="font-size:0.88rem;"></p>
                <h6 class="text-white fw-bold mb-1"><i class="fas fa-shield-alt text-warning me-1"></i> Recommended Treatment</h6>
                <p id="camResManagement" class="text-muted" style="font-size:0.88rem;"></p>
              </div>
            </div>

            <div class="d-flex gap-2 justify-content-end">
              <a id="btnCamPdf" href="#" target="_blank" class="btn-agri-primary btn-sm d-none">
                <i class="fas fa-file-pdf"></i> Download PDF
              </a>
              <button class="btn-agri-outline btn-sm" onclick="retakeSnapshot()">
                <i class="fas fa-camera"></i> Scan Another Leaf
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Placeholder -->
  <div id="footerPlaceholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/camera.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      AgriApp.renderNavbar();
      AgriApp.renderFooter();
    });
  </script>
</body>
</html>
